    file: "/.Docker.gitlab-ci.yml"

build-docker-staging:
  extends: .build-docker-multiple-stage-template
  before_script:
    - |
      cat <<EOF > .env
      HTTPS=http
      PORT=3000
      HOST=localhost
      NODE_ENV=development
      REACT_APP_ENV=staging
      REACT_APP_WEBSITE_NAME="Trixgo | Quản lý dự án"
      REACT_APP_API_DOMAIN_LOCAL=http://localhost:3003
      REACT_APP_API_DOMAIN_STAGING=https://cbs.trixgo.com
