      REACT_APP_URL_S3_PROJECT=https://dntdurzwr12tp.cloudfront.net/files/db/projects
      REACT_APP_URL_SOCKET_LOCAL=http://localhost:4000
      REACT_APP_URL_SOCKET_STAGING=https://websocket-cbs.trixgo.com
